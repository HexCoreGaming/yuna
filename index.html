<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yuna Pocket — V1.0.4</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#070814;color:#e8eaff;overflow:hidden}#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block}.chrome{position:fixed;pointer-events:none;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,2.2vw,28px)}.chrome>*{pointer-events:auto}.header,.footer{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(18px,3vw,32px);font-weight:760;letter-spacing:.22em;background:linear-gradient(100deg,#ad9bff,#79dcff);background-clip:text;color:transparent}.tag{font-size:10px;letter-spacing:.17em;color:#a6b3d6}.panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border:1px solid #58558670;border-radius:14px;background:#0c1123c9;backdrop-filter:blur(18px);max-width:860px}button,input{accent-color:#a18fff}button{color:#e9eaff;background:#171b34;border:1px solid #66669b;border-radius:8px;padding:9px 13px;cursor:pointer}button:hover,button.active{background:#493887}label{font-size:12px;color:#bfc9e8;display:flex;align-items:center;gap:8px}input[type=range]{width:112px}.footer{align-items:end}#status{font-size:11px;color:#88d7ff}.gate{position:fixed;z-index:10;inset:0;background:#050817f7;display:grid;place-items:center}.gatebox{border:1px solid #7767ae;border-radius:17px;padding:26px;width:min(380px,92vw);background:#0e1327;box-shadow:0 0 70px #5f42b729}.gatebox h1{margin:0 0 8px;font-size:24px}.gatebox p{color:#aab7dd;font-size:12px}.gatebox input{background:#090f20;color:white;padding:13px;border:1px solid #6d6d97;border-radius:8px;width:100%;margin:10px 0}.gatebox button{width:100%}.hidden{display:none!important}@media(max-width:570px){.footer{flex-direction:column;align-items:stretch}.panel{gap:5px;padding:9px}button{padding:8px 10px}label{font-size:11px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.3/pixi.min.js"></script>
</head>
<body>
<div id="stage"></div>
<div class="chrome"><div class="header"><div><div class="brand">YUNA</div><div class="tag">POCKET · V1.0.4 · WEBGL MESH</div></div><div class="tag">HEXCORE · PRIVATE STUDIO</div></div><div class="footer"><div class="panel"><button id="idle" class="active">IDLE</button><button id="dance">DANCE</button><button id="pulse">PULSE</button><button id="auto">AUTO: OFF</button><button id="tilt">ENABLE TILT</button><label>BOUNCE <input id="bounce" type="range" min="0" max="200" value="100"></label><label>ZOOM <input id="zoom" type="range" min="65" max="160" value="100"></label></div><div id="status">LOADING ARTWORK…</div></div></div>
<div id="gate" class="gate"><form id="gateform" class="gatebox"><div class="brand">YUNA</div><h1>CHARACTER ACCESS</h1><p id="gateLabel">V1.0.4 · CHECKPOINT 01 / 02</p><input id="pass" type="password" placeholder="ACCESS PHRASE" autocomplete="off" required><button>CONTINUE</button><p id="gateError" role="alert"></p></form></div>
<script>
'use strict';
// [001] ACCESS — display-only gate. GitHub Pages files remain publicly retrievable.
const $=id=>document.getElementById(id);
let step=0;const secrets=['YUNA-MOUTH','LUNA-BUTT'];
$('gateform').addEventListener('submit',e=>{e.preventDefault();if($('pass').value!==secrets[step]){$('gateError').textContent='INCORRECT PHRASE';return;}step++;$('pass').value='';$('gateError').textContent='';if(step<2){$('gateLabel').textContent='V1.0.4 · CHECKPOINT 02 / 02';$('pass').focus();}else $('gate').classList.add('hidden');});
// [002] PIXI APP — only the two provided/processed PNG images are character assets.
const app=new PIXI.Application({resizeTo:window,backgroundColor:0x070814,antialias:true,resolution:Math.min(devicePixelRatio||1,2),autoDensity:true});
$('stage').appendChild(app.view);
const scene=new PIXI.Container();app.stage.addChild(scene);
let body,mesh;
const SIZE={w:321,h:883}, AREA={x:68,y:195,w:184,h:145};
const GRID=15,COLS=GRID+1,ROWS=GRID+1;
const verts=new Float32Array(COLS*ROWS*2),uvs=new Float32Array(COLS*ROWS*2),indices=[];
const points=[];
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
 const u=x/GRID,v=y/GRID,px=AREA.x+u*AREA.w,py=AREA.y+v*AREA.h;
 const k=y*COLS+x;verts[2*k]=px;verts[2*k+1]=py;uvs[2*k]=px/SIZE.w;uvs[2*k+1]=py/SIZE.h;
 // Fixed border prevents tears between transparent overlay and static body.
 points.push({x:px,y:py,dx:0,dy:0,vx:0,vy:0,weight:Math.pow(Math.sin(Math.PI*u)*Math.sin(Math.PI*v),0.8)});
}
for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const a=y*COLS+x,b=a+1,c=a+COLS,d=c+1;indices.push(a,c,b,b,c,d);}
// [003] PHYSICS — spring/mass/damper; each vertex moves independently.
const config={stiffness:95,damping:5.8,mass:1,amplitude:1};
let action='idle',auto=false,clock=0,dragging=false,lastPointer=null,tiltX=0,tiltY=0,lastAuto=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function kick(dx,dy,strength=1,x=AREA.x+AREA.w/2,y=AREA.y+AREA.h/2){
 const mag=Math.hypot(dx,dy)||1;
 points.forEach(p=>{const r=Math.hypot((p.x-x)/AREA.w,(p.y-y)/AREA.h);const fall=Math.exp(-r*r*18)*p.weight*strength*config.amplitude;
 p.vx+=dx/mag*fall*115;p.vy+=dy/mag*fall*115;});
}
function update(dt){clock+=dt;if(auto&&clock-lastAuto>3.5){lastAuto=clock;action=Math.random()>.52?'dance':'idle';}
 const cyc=Math.sin(clock*(action==='dance'?8.5:2.4));
 points.forEach((p,i)=>{
  const secondary=p.weight;const dance=action==='dance'?cyc*3.5*secondary:0;
  const bx=secondary*(Math.sin(clock*1.7)*.7+dance+tiltX*8);
  const by=secondary*(Math.sin(clock*2.4+i*.011)*1.2+Math.abs(dance)*.7+tiltY*8);
  const ax=(config.stiffness*(bx-p.dx)-config.damping*p.vx)/config.mass;
  const ay=(config.stiffness*(by-p.dy)-config.damping*p.vy)/config.mass;
  p.vx+=ax*dt;p.vy+=ay*dt;p.dx+=p.vx*dt;p.dy+=p.vy*dt;
  verts[2*i]=p.x+p.dx*secondary;verts[2*i+1]=p.y+p.dy*secondary;
 });
 if(mesh){mesh.geometry.getBuffer('aVertexPosition').update();}
 if(body){scene.rotation=action==='dance'?Math.sin(clock*4.1)*.016:Math.sin(clock*.6)*.004;}
}
// [004] ASSET LOADING — errors are surfaced, not replaced with shapes.
(async()=>{try{
 const [base,overlay]=await Promise.all(['base_body.png','jiggle_assets.png'].map(url=>PIXI.Assets.load(url)));
 body=new PIXI.Sprite(base);body.width=SIZE.w;body.height=SIZE.h;scene.addChild(body);
 mesh=new PIXI.SimpleMesh(overlay,verts,uvs,new Uint16Array(indices),PIXI.DRAW_MODES.TRIANGLES);
 scene.addChild(mesh);fit();$('status').textContent='WEBGL ACTIVE · DRAG / TAP TO INTERACT';
 }catch(err){console.error(err);$('status').textContent='ASSET ERROR: CHECK PNG FILES AND HOSTING';}})();
function fit(){const w=app.screen.width,h=app.screen.height,scale=Math.min((w*.88)/SIZE.w,(h*.82)/SIZE.h)*Number($('zoom').value)/100;
 scene.scale.set(scale);scene.position.set(w/2-SIZE.w*scale/2,h/2-SIZE.h*scale/2);}
window.addEventListener('resize',fit);$('zoom').addEventListener('input',fit);
app.ticker.add(()=>update(Math.min(app.ticker.deltaMS/1000,.033)));
// [005] POINTER INPUT — tap impulse and drag velocity, mouse and touchscreen.
function localPosition(e){const box=app.view.getBoundingClientRect();const x=(e.clientX-box.left)*app.screen.width/box.width,y=(e.clientY-box.top)*app.screen.height/box.height;return {x:(x-scene.position.x)/scene.scale.x,y:(y-scene.position.y)/scene.scale.y};}
app.view.addEventListener('pointerdown',e=>{app.view.setPointerCapture(e.pointerId);dragging=true;lastPointer=localPosition(e);kick(0,60,1.2,lastPointer.x,lastPointer.y);});
app.view.addEventListener('pointermove',e=>{if(!dragging)return;const p=localPosition(e);kick((p.x-lastPointer.x)*3,(p.y-lastPointer.y)*3,.45,p.x,p.y);lastPointer=p;});
for(const event of ['pointerup','pointercancel','lostpointercapture'])app.view.addEventListener(event,()=>{dragging=false;lastPointer=null;});
// [006] MOBILE ORIENTATION — permission must be requested by a user gesture on iOS.
$('tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Unavailable');if(typeof DeviceOrientationEvent.requestPermission==='function'){const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted')throw Error('Permission denied');}
 window.addEventListener('deviceorientation',e=>{tiltX=clamp((e.gamma||0)/45,-1,1);tiltY=clamp((e.beta||0)/65,-1,1);});$('tilt').textContent='TILT: ON';}catch(e){$('status').textContent='TILT UNAVAILABLE OR DENIED';}};
// [007] UI — continuous simulation, no replacement illustrations or procedural figures.
$('idle').onclick=()=>{action='idle';auto=false;buttons();};$('dance').onclick=()=>{action='dance';auto=false;buttons();};
$('pulse').onclick=()=>kick((Math.random()-.5)*30,85,2.1);
$('auto').onclick=()=>{auto=!auto;lastAuto=clock;buttons();};
$('bounce').oninput=e=>{config.amplitude=Number(e.target.value)/100;};
function buttons(){for(const n of ['idle','dance'])$(n).classList.toggle('active',action===n);$('auto').textContent='AUTO: '+(auto?'ON':'OFF');}
</script>
</body></html>
